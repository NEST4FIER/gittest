# Publishes the salon website (at the site's main address) and the FierCoin
# website (at /fiercoin/) to GitHub Pages. Nothing else in this repository goes online.
# Runs every time the salon website changes, or by hand from the Actions tab.
name: Publish salon website

on:
  push:
    branches: [claude/salon-work-website-95l1m7]
    paths:
      - "salon-website/**"
      - "fiercoin-site/**"
      - ".github/workflows/salon-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Put both websites together
        run: |
          mkdir -p _site
          cp -r salon-website/. _site/
          mkdir -p _site/fiercoin
          cp -r fiercoin-site/. _site/fiercoin/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
