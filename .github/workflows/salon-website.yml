# Publishes only the salon-website folder to GitHub Pages
# (nothing else in this repository goes online).
# Runs every time the salon website changes, or by hand from the Actions tab.
name: Publish salon website

on:
  push:
    branches: [claude/salon-work-website-95l1m7]
    paths:
      - "salon-website/**"
      - ".github/workflows/salon-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: salon-website
      - id: deployment
        uses: actions/deploy-pages@v4
